<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexao3D — Impressão 3D Personalizada</title>
  <meta name="description" content="Brinquedos, chaveiros, miniaturas e produtos personalizados feitos com impressão 3D.">
  <meta property="og:title" content="Conexao3D — Impressão 3D Personalizada">
  <meta property="og:description" content="Brinquedos, chaveiros, miniaturas e produtos personalizados feitos com impressão 3D.">
  <meta property="og:type" content="website">

  <style>
    /* --- RESETS E VARIÁVEIS --- */
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.65);
      --border: rgba(138, 43, 226, 0.25);
      --border-glow: rgba(0, 240, 255, 0.4);
      --primary: #8a2be2;
      --primary-glow: #9d4edf;
      --cyan: #00f0ff;
      --text: #f0f3f8;
      --text-muted: #a0a5b5;
      --glass: rgba(255, 255, 255, 0.03);
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* --- BACKGROUND GRID & PARTÍCULAS --- */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
      pointer-events: none;
    }

    .glow-orb {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, rgba(0, 240, 255, 0.05) 50%, transparent 70%);
      top: -200px;
      left: -200px;
      z-index: -1;
      pointer-events: none;
      filter: blur(80px);
    }

    /* --- LOADING SCREEN --- */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050508;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff, var(--cyan), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .loader-bar {
      width: 160px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loader-progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--cyan));
      animation: loadAnim 1.5s infinite linear;
      transform-origin: 0 50%;
    }

    @keyframes loadAnim {
      0% { transform: scaleX(0); }
      50% { transform: scaleX(0.7); }
      100% { transform: scaleX(1); }
    }

    /* --- UI ELEMENTS --- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.8rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid transparent;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #5a189a);
      color: #fff;
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.8);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text);
      backdrop-filter: blur(10px);
    }

    .btn-outline:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      color: #fff;
      transform: translateY(-2px);
    }

    .section-title {
      font-size: 2.2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, #b8c1ec);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 3rem;
      font-size: 1rem;
    }

    section {
      padding: 5rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* --- NAVBAR --- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: all 0.3s ease;
      padding: 1.2rem 2rem;
    }

    header.scrolled {
      background: rgba(9, 10, 15, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.8rem 2rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo span {
      color: var(--cyan);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--cyan);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
    }

    .hamburger span {
      width: 25px;
      height: 2px;
      background: var(--text);
      transition: all 0.3s ease;
    }

    /* --- HERO & ANIMAÇÃO IMPRESSORA 3D --- */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6rem;
      gap: 2rem;
    }

    .hero-content {
      flex: 1;
      max-width: 550px;
    }

    .hero-tag {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      background: rgba(138, 43, 226, 0.15);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--cyan);
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
    }

    .hero-title {
      font-size: 3rem;
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .hero-title span {
      background: linear-gradient(135deg, var(--cyan), var(--primary-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .printer-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Canvas / SVG Printer Visual */
    .printer-card {
      width: 100%;
      max-width: 450px;
      height: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(138, 43, 226, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
