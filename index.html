<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexao3D — Impressora 3D</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #24143d 0%, #0b0710 45%, #050505 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* CENA */
.scene {
    width: 560px;
    height: 560px;
    position: relative;
    perspective: 1000px;
}

/* BRILHO ATRÁS DA MÁQUINA */
.glow {
    position: absolute;
    width: 380px;
    height: 380px;
    left: 90px;
    top: 90px;
    background: #9d4edd;
    filter: blur(110px);
    opacity: .16;
}

/* BASE */
.base {
    position: absolute;
    width: 430px;
    height: 65px;
    left: 65px;
    bottom: 55px;
    background: linear-gradient(145deg, #29232e, #0e0c10);
    border: 2px solid #594064;
    border-radius: 14px;
    box-shadow:
        0 20px 50px #000,
        inset 0 0 20px #000;
    transform: perspective(500px) rotateX(55deg);
}

/* MESA */
.bed {
    position: absolute;
    width: 330px;
    height: 32px;
    left: 115px;
    bottom: 122px;
    background: linear-gradient(#39313d, #151217);
    border: 2px solid #754995;
    border-radius: 6px;
    box-shadow: 0 0 25px #8d42c866;
    transform: perspective(500px) rotateX(55deg);
}

/* PILARES */
.pillar {
    position: absolute;
    width: 18px;
    height: 390px;
    bottom: 110px;
    background: linear-gradient(90deg, #111, #555, #171717);
    border: 1px solid #6d5875;
    border-radius: 5px;
}

.left {
    left: 95px;
}

.right {
    right: 95px;
}

/* TOPO */
.top {
    position: absolute;
    width: 385px;
    height: 20px;
    left: 87px;
    top: 72px;
    background: linear-gradient(90deg, #171318, #51405a, #171318);
    border-radius: 8px;
    box-shadow: 0 0 15px #a14ce655;
}

/* EIXO */
.rail {
    position: absolute;
    width: 350px;
    height: 10px;
    left: 105px;
    top: 118px;
    background: #29212e;
    border: 1px solid #72517f;
    border-radius: 10px;
}

/* CABEÇOTE */
.head {
    position: absolute;
    width: 80px;
    height: 60px;
    left: 240px;
    top: 100px;
    z-index: 5;
    animation: moveHead 4s ease-in-out infinite;
}

.head-body {
    width: 80px;
    height: 38px;
    background: linear-gradient(145deg, #51465a, #17131a);
    border: 2px solid #8c5ba3;
    border-radius: 8px;
    box-shadow: 0 0 20px #a54ee555;
}

.nozzle {
    position: absolute;
    width: 20px;
    height: 30px;
    left: 30px;
    top: 35px;
    background: linear-gradient(#777, #222);
    clip-path: polygon(20% 0,80% 0,100% 65%,50% 100%,0 65%);
}

.tip {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #d98cff;
    border-radius: 50%;
    left: 36px;
    top: 62px;
    box-shadow: 0 0 15px #d98cff;
}

/* BONECO */
.model {
    position: absolute;
    left: 215px;
    bottom: 150px;
    width: 130px;
    height: 190px;
}

/* CAMADAS */
.layer {
    position: absolute;
    left: 25px;
    width: 80px;
    height: 6px;
    background: linear-gradient(90deg, #7b32b2, #d47cff, #7b32b2);
    border-radius: 50%;
    box-shadow: 0 0 7px #b653e8;
    opacity: 0;
    animation: print 8s infinite;
}

/* Faz cada camada aparecer em sequência */
.layer:nth-child(1)  { bottom: 0; animation-delay: 0s; }
.layer:nth-child(2)  { bottom: 7px; animation-delay: .2s; }
.layer:nth-child(3)  { bottom: 14px; animation-delay: .4s; }
.layer:nth-child(4)  { bottom: 21px; animation-delay: .6s; }
.layer:nth-child(5)  { bottom: 28px; animation-delay: .8s; }
.layer:nth-child(6)  { bottom: 35px; animation-delay: 1s; }
.layer:nth-child(7)  { bottom: 42px; animation-delay: 1.2s; }
.layer:nth-child(8)  { bottom: 49px; animation-delay: 1.4s; }
.layer:nth-child(9)  { bottom: 56px; animation-delay: 1.6s; }
.layer:nth-child(10) { bottom: 63px; animation-delay: 1.8s; }
.layer:nth-child(11) { bottom: 70px; animation-delay: 2s; }
.layer:nth-child(12) { bottom: 77px; animation-delay: 2.2s; }
.layer:nth-child(13) { bottom: 84px; animation-delay: 2.4s; }
.layer:nth-child(14) { bottom: 91px; animation-delay: 2.6s; }
.layer:nth-child(15) { bottom: 98px; animation-delay: 2.8s; }
.layer:nth-child(16) { bottom: 105px; animation-delay: 3s; }
.layer:nth-child(17) { bottom: 112px; animation-delay: 3.2s; }
.layer:nth-child(18) { bottom: 119px; animation-delay: 3.4s; }
.layer:nth-child(19) { bottom: 126px; animation-delay: 3.6s; }
.layer:nth-child(20) { bottom: 133px; animation-delay: 3.8s; }

/* MOVIMENTO DO CABEÇOTE */
@keyframes moveHead {
    0%, 100% {
        transform: translateX(-120px);
    }

    50% {
        transform: translateX(120px);
    }
}

/* IMPRESSÃO */
@keyframes print {
    0%, 8% {
        opacity: 0;
        transform: scaleX(.1);
    }

    15%, 75% {
        opacity: 1;
        transform: scaleX(1);
    }

    90%, 100% {
        opacity: .9;
        transform: scaleX(1);
    }
}

/* FILAMENTO */
.filament {
    position: absolute;
    width: 3px;
    height: 45px;
    background: #d77cff;
    left: 276px;
    top: 164px;
    opacity: .8;
    box-shadow: 0 0 8px #d77cff;
    animation: filament 4s ease-in-out infinite;
}

@keyframes filament {
    0%, 100% {
        transform: translateX(-120px);
    }

    50% {
        transform: translateX(120px);
    }
}

/* LUZES */
.light {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #b75cff;
    box-shadow: 0 0 12px #b75cff;
    animation: blink 1.5s infinite alternate;
}

.light.one {
    left: 105px;
    top: 80px;
}

.light.two {
    right: 105px;
    top: 80px;
    animation-delay: .5s;
}

@keyframes blink {
    from { opacity: .35; }
    to { opacity: 1; }
}

/* TEXTO */
.title {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 18px;
    letter-spacing: 5px;
    opacity: .8;
}

/* CELULAR */
@media(max-width:600px) {
    .scene {
        transform: scale(.72);
    }
}

@media(max-width:430px) {
    .scene {
        transform: scale(.58);
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="glow"></div>

    <div class="pillar left"></div>
    <div class="pillar right"></div>

    <div class="top"></div>
    <div class="rail"></div>

    <div class="head">
        <div class="head-body"></div>
        <div class="nozzle"></div>
        <div class="tip"></div>
    </div>

    <div class="filament"></div>

    <div class="bed"></div>
    <div class="base"></div>

    <!-- Boneco sendo construído -->
    <div class="model">
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
    </div>

    <div class="light one"></div>
    <div class="light two"></div>

    <div class="title">CONEXAO3D</div>

</div>

</body>
</html>
